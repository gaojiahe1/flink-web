services:
  flink-web-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      FLINK_WEB_STORAGE_TYPE: local
      FLINK_WEB_STORAGE_INITIALIZE: "true"
      FLINK_WEB_LOCAL_PATH: /app/data/flink-web.db
      FLINK_WEB_ADMIN_PASSWORD: ${FLINK_WEB_ADMIN_PASSWORD:?Set a bootstrap password}
      FLINK_WEB_MASTER_KEY: ${FLINK_WEB_MASTER_KEY:?Set a 32-byte Base64 key}
      FLINK_WEB_NAMESPACE: ${FLINK_WEB_NAMESPACE:-flink-jobs}
      FLINK_WEB_S3_BUCKET: ${FLINK_WEB_S3_BUCKET:-}
      FLINK_WEB_S3_ENDPOINT: ${FLINK_WEB_S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      FLINK_WEB_AI_TELEMETRY_ENABLED: ${FLINK_WEB_AI_TELEMETRY_ENABLED:-false}
      FLINK_WEB_AI_TELEMETRY_MODE: ${FLINK_WEB_AI_TELEMETRY_MODE:-collector}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-default}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://host.docker.internal:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      FLINK_WEB_OTEL_TRACES_ENDPOINT: ${FLINK_WEB_OTEL_TRACES_ENDPOINT:-http://host.docker.internal:14318/v1/traces}
    volumes:
      - platform-data:/app/data
    restart: unless-stopped
  frontend:
    build: ../frontend
    ports:
      - "8080:8080"
    depends_on:
      - flink-web-backend
    restart: unless-stopped
volumes:
  platform-data:
