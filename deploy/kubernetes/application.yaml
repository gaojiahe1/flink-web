apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flink-web-data
  namespace: flink-kubernetes-operator
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-storage
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: flink-web-secrets
  namespace: flink-kubernetes-operator
type: Opaque
stringData:
  FLINK_WEB_ADMIN_USERNAME: "admin"
  # 首次创建管理员：至少 12 个字符，UTF-8 最多 72 字节；不是 fwenc1: 密文。
  FLINK_WEB_ADMIN_PASSWORD: "123456789abcd"
  # 仅首次新装用 openssl rand -base64 32 生成，粘贴完整输出；与数据备份分开保管。
  FLINK_WEB_MASTER_KEY: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-web-backend
  namespace: flink-kubernetes-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: flink-web-backend}
  template:
    metadata:
      labels: {app: flink-web-backend}
    spec:
      serviceAccountName: flink-operator
      securityContext:
        fsGroup: 10001
      containers:
        - name: backend
          image: 192.168.68.163:5000/flink-web/app:0.0.3
          ports: [{containerPort: 8080}]
          env:
            - {name: FLINK_WEB_NAMESPACE, value: flink-kubernetes-operator}
            # 改为运维实际部署 Operator 的 namespace / Deployment；跨 namespace RBAC 见 operator-rbac.yaml。
            - {name: FLINK_WEB_OPERATOR_NAMESPACE, value: flink-kubernetes-operator}
            - {name: FLINK_WEB_OPERATOR_DEPLOYMENT, value: flink-kubernetes-operator}
            - {name: FLINK_WEB_OPERATOR_CONTAINER, value: flink-kubernetes-operator}
            - {name: FLINK_WEB_STORAGE_TYPE, value: local}
            - {name: FLINK_WEB_LOCAL_PATH, value: /app/data/flink-web.db}
            # 自动判断：数据库文件不存在时创建；已存在时保留数据，仅检查并执行必要的版本升级。
            - {name: FLINK_WEB_STORAGE_INITIALIZE, value: "true"}
            - {name: FLINK_WEB_STATE_ROOT, value: "s3://flink-state"}
            - {name: FLINK_WEB_S3_BUCKET, value: "flink-web"}
            - {name: FLINK_WEB_S3_ENDPOINT, value: "http://minio.flink-kubernetes-operator.svc.cluster.local:9000"}
            # 复用同 namespace 的 MinIO Secret；生产可改为仅允许所需桶的专用凭据。
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_ROOT_PASSWORD
          # 引用本文件前面的 Secret，注入管理员密码及配置加密主密钥。
          envFrom:
            - secretRef: {name: flink-web-secrets}
          volumeMounts:
            - {name: data, mountPath: /app/data}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 15
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 60
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: flink-web-data}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-web-backend
  namespace: flink-kubernetes-operator
spec:
  selector: {app: flink-web-backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-web-frontend
  namespace: flink-kubernetes-operator
spec:
  replicas: 1
  selector:
    matchLabels: {app: flink-web-frontend}
  template:
    metadata:
      labels: {app: flink-web-frontend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: 192.168.68.163:5000/flink-web/web:0.0.3
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: {path: /, port: 8080}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: flink-web
  namespace: flink-kubernetes-operator
spec:
  type: NodePort
  selector: {app: flink-web-frontend}
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
