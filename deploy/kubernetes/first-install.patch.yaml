# 只供确认无旧数据的首次部署使用，不是独立 Kubernetes 资源，不能 kubectl apply。
# kubectl -n flink-kubernetes-operator patch deployment flink-web-backend --type=strategic --patch-file deploy/kubernetes/first-install.patch.yaml
# 初始化成功后恢复 application.yaml 的 INITIALIZE=false。
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: FLINK_WEB_STORAGE_INITIALIZE
              value: "true"
