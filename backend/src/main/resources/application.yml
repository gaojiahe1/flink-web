server:
  port: ${SERVER_PORT:8080}
  bes:
    basedir: ${FLINK_WEB_BES_BASEDIR:${java.io.tmpdir}/flink-web-bes}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${FLINK_WEB_SECURE_COOKIE:false}
spring:
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 260MB
management:
  endpoints:
    web:
      exposure:
        include: health
platform:
  sql-validation:
    directory: ${FLINK_WEB_SQL_VALIDATOR_DIR:./sql-validators}
    runner-jar: ${FLINK_WEB_SQL_RUNNER_JAR:./sql-runner/target/flink-web-sql-runner.jar}
  namespace: ${FLINK_WEB_NAMESPACE:flink-jobs}
  storage:
    type: ${FLINK_WEB_STORAGE_TYPE:local}
    local-path: ${FLINK_WEB_LOCAL_PATH:./data/flink-web.db}
    initialize: ${FLINK_WEB_STORAGE_INITIALIZE:true}
    mysql-url: ${FLINK_WEB_MYSQL_URL:jdbc:mysql://localhost:3306/flink_web?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    mysql-username: ${FLINK_WEB_MYSQL_USERNAME:flink_web}
    mysql-password: ${FLINK_WEB_MYSQL_PASSWORD:}
  security:
    username: ${FLINK_WEB_ADMIN_USERNAME:admin}
    password: ${FLINK_WEB_ADMIN_PASSWORD:}
    master-key: ${FLINK_WEB_MASTER_KEY:}
  kubernetes:
    url: ${FLINK_WEB_K8S_URL:https://kubernetes.default.svc}
    token-file: ${FLINK_WEB_K8S_TOKEN_FILE:/var/run/secrets/kubernetes.io/serviceaccount/token}
    ca-file: ${FLINK_WEB_K8S_CA_FILE:/var/run/secrets/kubernetes.io/serviceaccount/ca.crt}
  operator:
    namespace: ${FLINK_WEB_OPERATOR_NAMESPACE:${FLINK_WEB_NAMESPACE:flink-jobs}}
    deployment: ${FLINK_WEB_OPERATOR_DEPLOYMENT:flink-kubernetes-operator}
    container: ${FLINK_WEB_OPERATOR_CONTAINER:flink-kubernetes-operator}
    state-root: ${FLINK_WEB_STATE_ROOT:s3://flink-state}
  artifacts:
    downloader-image: ${FLINK_WEB_DOWNLOADER_IMAGE:}
    allowed-hosts: ${FLINK_WEB_ARTIFACT_HOSTS:}
    credentials-secret: ${FLINK_WEB_ARTIFACT_CREDENTIALS_SECRET:}
  s3:
    endpoint: ${FLINK_WEB_S3_ENDPOINT:}
    bucket: ${FLINK_WEB_S3_BUCKET:}
    prefix: ${FLINK_WEB_S3_PREFIX:artifacts/}
    region: ${AWS_REGION:us-east-1}

flink-web:
  ai:
    telemetry:
      enabled: ${FLINK_WEB_AI_TELEMETRY_ENABLED:false}
      mode: ${FLINK_WEB_AI_TELEMETRY_MODE:collector}
      environment: ${LANGFUSE_TRACING_ENVIRONMENT:default}
      capture-content: ${FLINK_WEB_AI_TELEMETRY_CAPTURE_CONTENT:true}
      langfuse-base-url: ${LANGFUSE_BASE_URL:http://127.0.0.1:3000}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      endpoint: ${FLINK_WEB_OTEL_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
logging:
  level:
    org.springframework.ai: "OFF"
    org.springframework.web.reactive.function.client: "OFF"
